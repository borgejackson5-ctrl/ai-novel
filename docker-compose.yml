# ============================================================
# 一键启动全栈：docker compose up -d
# 包含 MySQL + Redis + RabbitMQ + 后端 + 前端
#
# ⚠️ 这是**本地开发**用的 compose：下面几处 `${VAR:-默认值}` 是本地便利，
# 默认口令只适合本机。**上服务器请用 docker-compose.prod.yml** ——
# 那份已改成 `${VAR:?...}` 强制从 .env 读取，不会静默退回弱口令。
# ============================================================

# 固定 compose 项目名：默认取「目录名」，目录改名会连带换掉网络与卷的前缀
name: ai-novel

services:
  # ---------- 数据库 ----------
  mysql:
    image: mysql:8.0
    container_name: ai-novel-mysql
    ports:
      # 宿主机 3307 避免与本机 MySQL 3306 冲突；容器内仍是 3306
      - "3307:3306"
    environment:
      # 敏感信息一律走环境变量；下列默认值仅为「克隆后能直接起来」的占位值，不是任何环境的真实口令。
      # 本机与生产都用 .env 覆盖（.env 已在 .gitignore 中，见 .env.example）
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev-local-mysql}
      MYSQL_DATABASE: ai_drama
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # MySQL 官方镜像会自动执行 /docker-entrypoint-initdb.d/ 下的 .sql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---------- 缓存/会话/锁 ----------
  redis:
    image: redis:7-alpine
    container_name: ai-novel-redis
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-local-redis}
    # 注意：exec 形式 command 不经过 shell，$$ 转义只会得到字面量 "${REDIS_PASSWORD}"，
    # 必须让 compose 在解析阶段直接插值，与上方 environment 保持同源
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dev-local-redis}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # ---------- 消息队列 ----------
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ai-novel-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped

  # ---------- 搜索引擎 ----------
  elasticsearch:
    build:
      context: ./elasticsearch
    container_name: ai-novel-es
    ports:
      # 宿主机 9201 避免与本机 cpolar 的 9200 冲突；容器内仍是 9200
      - "9201:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      # 单节点 demo，限制堆内存，避免吃满本机
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=ai-novel
      - TZ=Asia/Shanghai
    volumes:
      # 默认挂载到项目内相对路径（clone 即可用，不依赖本机 D 盘）；
      # 若需把大体积索引放到指定磁盘，在 .env 中设置 ES_DATA_DIR=D:/docker-data/ai-novel/elasticsearch
      - ${ES_DATA_DIR:-./docker-data/elasticsearch}:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200/_cluster/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  # ---------- ES 管理控制台（仅本地开发用）----------
  # 目的：Dev Tools 里手写 Query DSL 调试搜索、_analyze 实测 IK 切词、看 mapping。
  # 注意：Kibana 版本必须与 ES 完全一致，否则拒绝启动 —— ES 镜像 tag 是 8.18.1。
  # 生产 compose（docker-compose.prod.yml）刻意不含它：2核4G 塞不下这个 Node 进程。
  kibana:
    image: docker.elastic.co/kibana/kibana:8.18.1
    container_name: ai-novel-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      # ES 关了安全认证，Kibana 侧同步关掉，否则会卡在登录页
      XPACK_SECURITY_ENABLED: "false"
      I18N_LOCALE: zh-CN
      TZ: Asia/Shanghai
    depends_on:
      elasticsearch:
        condition: service_healthy
    # 本地机器上别让它无节制吃内存
    mem_limit: 1g
    restart: unless-stopped

  # ---------- 后端 ----------
  backend:
    build:
      context: ./backend
    container_name: ai-novel-backend
    ports:
      # 宿主机 8081 避免与本机已运行的后端 8080 冲突；容器内仍是 8080
      - "8081:8080"
    environment:
      # 通过环境变量覆盖 application.yaml，指向容器内服务名
      # allowPublicKeyRetrieval=true：MySQL 8 默认 caching_sha2_password，useSSL=false 时需 RSA 公钥交换
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_drama?autoReconnect=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev-local-mysql}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-local-redis}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      # Elasticsearch 搜索
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      # AI Key 留空则自动降级 Mock
      AI_API_KEY: ${AI_API_KEY:-}
      # 临时开 health 详情，排查 503 DOWN 根因
      MANAGEMENT_ENDPOINT_HEALTH_SHOW-DETAILS: always
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ---------- 前端 ----------
  frontend:
    build:
      context: ./frontend
    container_name: ai-novel-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  # 显式命名，让卷名与「目录名」解耦。
  # 默认情况下 compose 会拼成 {目录名}_{卷名}，目录一改名就等于换了一个空卷 ——
  # 表面上看数据「丢了」，其实是没挂上。写死名字后，以后目录怎么改都不影响数据。
  mysql-data:
    name: ai-novel-mysql-data
  redis-data:
    name: ai-novel-redis-data
  rabbitmq-data:
    name: ai-novel-rabbitmq-data
